<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Panel de administración | Equilibrado Deporte</title>

    <link rel="stylesheet" href="style.css">

    <style>
        /* ==========================================
           PANTALLA DE ACCESO
        =========================================== */

        #loginScreen {
            position: fixed;
            inset: 0;
            z-index: 99999;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #111;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;

            background: #fff;
            padding: 35px;
            border-radius: 16px;

            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);

            text-align: center;
        }

        .login-box h1 {
            margin: 0 0 8px;
        }

        .login-box p {
            margin: 0 0 25px;
            color: #666;
        }

        .login-box input {
            width: 100%;
            box-sizing: border-box;

            padding: 13px 15px;
            margin-bottom: 15px;

            border: 1px solid #ccc;
            border-radius: 8px;

            font-size: 16px;
        }

        .login-box button {
            width: 100%;

            padding: 13px;

            border: none;
            border-radius: 8px;

            background: #111;
            color: #fff;

            font-size: 16px;
            font-weight: 700;

            cursor: pointer;
        }

        .login-box button:hover {
            background: #333;
        }

        #loginError {
            display: none;

            margin-top: 15px;

            color: #c62828;
            font-weight: 700;
        }

        /* El panel comienza oculto */
        #adminPanel {
            display: none;
        }
    </style>
</head>

<body>


    <!-- ==========================================
         PANTALLA DE CONTRASEÑA
    =========================================== -->

    <div id="loginScreen">

        <div class="login-box">

            <h1>Equilibrado Deporte</h1>

            <p>
                Panel de administración
            </p>

            <form id="loginForm">

                <input
                    type="password"
                    id="adminPassword"
                    placeholder="Contraseña"
                    autocomplete="current-password"
                    required
                >

                <button type="submit">
                    Ingresar
                </button>

            </form>

            <div id="loginError">
                Contraseña incorrecta.
            </div>

        </div>

    </div>


    <!-- ==========================================
         PANEL DE ADMINISTRACIÓN
    =========================================== -->

    <main
        class="admin-container"
        id="adminPanel"
    >

        <header class="admin-header">

            <h1>
                Panel de administración
            </h1>

            <p>
                Equilibrado Deporte
            </p>

        </header>


        <!-- ==========================================
             AGREGAR PRODUCTO
        =========================================== -->

        <section class="admin-card">

            <h2>
                Agregar producto
            </h2>

            <form id="productoForm">

                <!-- NOMBRE -->

                <div class="form-group">

                    <label for="nombre">
                        Nombre del producto
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        placeholder="Ej: Zapatillas Running"
                        required
                    >

                </div>


                <!-- CATEGORÍA -->

                <div class="form-group">

                    <label for="categoria">
                        Categoría
                    </label>

                    <select
                        id="categoria"
                        required
                    >

                        <option value="">
                            Seleccionar categoría
                        </option>

                        <option value="Deportes">
                            Deportes
                        </option>

                        <option value="Calzados">
                            Calzados
                        </option>

                        <option value="Accesorios">
                            Accesorios
                        </option>

                    </select>

                </div>


                <!-- PRECIO -->

                <div class="form-group">

                    <label for="precio">
                        Precio
                    </label>

                    <input
                        type="number"
                        id="precio"
                        placeholder="Ej: 50000"
                        min="0"
                        required
                    >

                </div>


                <!-- DESCRIPCIÓN -->

                <div class="form-group">

                    <label for="descripcion">
                        Descripción
                    </label>

                    <textarea
                        id="descripcion"
                        rows="4"
                        placeholder="Descripción del producto..."
                    ></textarea>

                </div>


                <!-- IMAGEN -->

                <div class="form-group">

                    <label for="imagen">
                        Foto del producto
                    </label>

                    <input
                        type="file"
                        id="imagen"
                        accept="image/*"
                        multiple
                        required
                    >

                </div>


                <!-- BOTÓN -->

                <button
                    type="submit"
                    class="btn-primary"
                >
                    Agregar producto
                </button>

            </form>

        </section>


        <!-- ==========================================
             PRODUCTOS
        =========================================== -->

        <section class="admin-card">

            <div class="section-title">

                <h2>
                    Productos agregados
                </h2>

                <button
                    type="button"
                    class="btn-secondary"
                    onclick="cargarProductos()"
                >
                    Actualizar
                </button>

            </div>

            <div id="listaProductos">

                <p>
                    Cargando productos...
                </p>

            </div>

        </section>

    </main>


    <!-- ==========================================
         LOGIN
    =========================================== -->

    <script>

        /*
         * =========================================
         * CONTRASEÑA DEL PANEL
         * =========================================
         *
         * CAMBIÁ ESTA CONTRASEÑA POR LA QUE QUIERAS.
         */

        const ADMIN_PASSWORD = "Equilibrado2026";


        const loginForm =
            document.getElementById("loginForm");

        const passwordInput =
            document.getElementById("adminPassword");

        const loginScreen =
            document.getElementById("loginScreen");

        const adminPanel =
            document.getElementById("adminPanel");

        const loginError =
            document.getElementById("loginError");


        loginForm.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();

                const password =
                    passwordInput.value;


                if (password === ADMIN_PASSWORD) {

                    loginScreen.style.display =
                        "none";

                    adminPanel.style.display =
                        "block";

                    passwordInput.value = "";

                    /*
                     * Cargar productos después
                     * de entrar al panel.
                     */

                    if (
                        typeof cargarProductos ===
                        "function"
                    ) {
                        cargarProductos();
                    }

                } else {

                    loginError.style.display =
                        "block";

                    passwordInput.value = "";

                    passwordInput.focus();

                }

            }
        );

    </script>


    <!-- ==========================================
         JAVASCRIPT DEL PANEL
    =========================================== -->

    <script src="admin.js"></script>


</body>
</html>>
